<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TechInGrow Admin</title>

    <link
        rel="stylesheet"
        href="/admin/static/styles.css"
    >
</head>

<body class="login-body">

<div class="login-wrapper">

    <div class="login-card">

        <div class="brand">
            <div class="brand-logo">
                TIG
            </div>

            <div>
                <h1>
                    TechInGrow
                </h1>

                <p>
                    Admin Panel
                </p>
            </div>
        </div>

        <div class="login-title">
            <h2>
                Admin Login
            </h2>

            <p>
                Dashboardga kirish uchun admin accountingizdan foydalaning.
            </p>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    required
                    placeholder="admin"
                >
            </div>

            <div class="form-group">
                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                    placeholder="••••••••"
                >
            </div>

            <button
                id="loginButton"
                type="submit"
                class="primary-button"
            >
                Kirish
            </button>

        </form>

        <div
            id="loginError"
            class="error-message hidden"
        ></div>

    </div>

</div>

<script src="/admin/static/login.js"></script>

</body>
</html>
